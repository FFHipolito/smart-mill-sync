services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-mill-sync-db
    environment:
      POSTGRES_DB: smart_mill_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - smart-mill-sync-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_mill_sync"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smart-mill-sync-postgres:
